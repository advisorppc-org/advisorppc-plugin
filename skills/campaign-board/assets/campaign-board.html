<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AdvisorPPC Campaign Board</title>
<style>
  /* Chart marks use validated steps of the brand green: #047857 on light,
     #0e9f6e on dark (3:1 against the surface, CVD-separated from the grey). */
  :root { color-scheme: light dark;
    --bg: #fbfaf7; --ink: #0f1112; --ink-2: #3c4043; --muted: #5f6368;
    --line: rgba(15,17,18,.12); --soft: rgba(15,17,18,.045);
    --brand: #10B981; --mark: #047857; --ref: #878c91; --wash: rgba(4,120,87,.10);
    --good: #047857; --bad: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) { --bg: #0f1112; --ink: #f3f2ee; --ink-2: #d4d3cf; --muted: #9ea2a6;
      --line: rgba(251,250,247,.14); --soft: rgba(251,250,247,.06);
      --mark: #0e9f6e; --ref: #6b7075; --wash: rgba(14,159,110,.14); --good: #34d399; --bad: #f08a80; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #0f1112; --ink: #f3f2ee; --ink-2: #d4d3cf; --muted: #9ea2a6;
    --line: rgba(251,250,247,.14); --soft: rgba(251,250,247,.06);
    --mark: #0e9f6e; --ref: #6b7075; --wash: rgba(14,159,110,.14); --good: #34d399; --bad: #f08a80; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 20px 20px 28px; }
  .banner { margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--brand);
    border-radius: 8px; background: var(--soft); font-size: 13px; color: var(--ink-2); }
  .banner a, .empty a { color: inherit; font-weight: 600; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .toolbar select, .toolbar button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; min-height: 32px; cursor: pointer; }
  header { margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; }
  .brand span { font-weight: 500; color: var(--muted); }
  .brand .mark { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); }
  .meta { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  h1 { margin: 10px 0 0; font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -.015em; }
  h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .kpi { position: relative; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px; background: var(--soft);
    display: flex; flex-direction: column; gap: 2px; min-height: 118px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
  .kpi .prev { color: var(--muted); font-size: 11.5px; }
  .spark { width: 100%; height: 26px; margin-top: auto; }
  .spark polyline { fill: none; stroke: var(--ref); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .spark circle { fill: var(--mark); stroke: var(--bg); stroke-width: 1.5; }
  .delta { display: inline-flex; align-items: center; gap: 3px; width: fit-content; font-size: 12px; font-weight: 600;
    color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta i { font-style: normal; font-weight: 700; }
  .delta.good i { color: var(--good); } .delta.bad i { color: var(--bad); }
  .delta.flat i, .delta.none { color: var(--muted); font-weight: 500; }
  .insights, .actions { margin-bottom: 18px; }
  .actions ol { margin: 0; padding: 0; list-style: none; counter-reset: act; display: grid; gap: 6px; }
  .actions li { position: relative; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-left: 3px solid var(--mark);
    border-radius: 10px; color: var(--ink); counter-increment: act; }
  .actions li::before { content: counter(act); position: absolute; left: 12px; top: 8px; font-weight: 700; color: var(--mark);
    font-variant-numeric: tabular-nums; }
  .budget { margin-bottom: 18px; }
  .budget .meta { margin: -4px 0 10px; }
  .budget td.meter { width: 34%; min-width: 120px; }
  .mtrack { position: relative; display: block; height: 10px; border-radius: 5px; background: var(--soft); }
  .mfill { display: block; height: 100%; border-radius: 5px; background: var(--mark); }
  .mfill.over { background: var(--bad); }
  .mline { position: absolute; top: -3px; bottom: -3px; left: 66.667%; width: 2px; background: var(--ink); opacity: .55; }
  .insights ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .insights li { position: relative; padding: 8px 12px 8px 30px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink-2); }
  .insights li::before { position: absolute; left: 11px; top: 8px; font-weight: 700; }
  .insights li.good::before { content: "↑"; color: var(--good); }
  .insights li.bad::before { content: "!"; color: var(--bad); }
  .insights li.info::before { content: "i"; color: var(--muted); font-style: italic; }
  .trend { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 18px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 8px; }
  figcaption { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .line { fill: none; stroke: var(--mark); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .area { fill: var(--wash); }
  .dot { fill: var(--mark); stroke: var(--bg); stroke-width: 2; }
  .col { fill: var(--mark); }
  .hit { fill: transparent; cursor: crosshair; outline: none; }
  .hit:hover, .hit:focus { fill: var(--soft); }
  .cross { stroke: var(--ink); stroke-width: 1; opacity: 0; pointer-events: none; }
  .cross.on { opacity: .35; }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 18px; align-items: start; }
  .bars ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .bars li { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 8px; align-items: center; outline: none; border-radius: 6px; }
  .bars li:hover, .bars li:focus { background: var(--soft); }
  .bname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--ink-2); }
  .track { height: 14px; }
  .bar { display: block; height: 100%; min-width: 2px; background: var(--mark); border-radius: 0 4px 4px 0; }
  .bval { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tree { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tree ul { list-style: none; margin: 0; padding-left: 16px; }
  .tree > ul { padding-left: 0; }
  .tree li { position: relative; padding: 3px 0 3px 12px; }
  .tree ul ul li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--line); }
  .tree ul ul li::after { content: ""; position: absolute; left: 0; top: 13px; width: 9px; border-top: 1px solid var(--line); }
  .tree ul ul li:last-child::before { bottom: auto; height: 13px; }
  .node { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 13px; }
  .node.acct { font-weight: 650; } .node small { color: var(--muted); font-weight: 400; }
  .node .meta { margin: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  .node.leaf { color: var(--ink-2); font-size: 12.5px; } .node.none { color: var(--muted); font-style: italic; }
  .status { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; line-height: 18px; white-space: nowrap; }
  .status i { font-style: normal; } .status.s-enabled i { color: var(--mark); }
  .perf .wrap, .budget .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  thead th { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  th[scope="row"], thead th:first-child { text-align: left; font-weight: 500; }
  th[scope="row"] { min-width: 220px; }
  .cname { display: inline-block; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; max-width: 240px; margin-right: 8px; }
  td.d, th.d { padding-left: 2px; text-align: left; }
  tfoot th, tfoot td { border-bottom: 0; font-weight: 650; }
  tbody tr:hover { background: var(--soft); }
  .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  .empty { padding: 32px 12px; color: var(--muted); text-align: center; }
  footer { margin-top: 18px; color: var(--muted); font-size: 11.5px; }
  #tip { position: fixed; z-index: 10; pointer-events: none; max-width: 280px; padding: 6px 9px; border-radius: 8px;
    background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; }
  .loading { opacity: .55; transition: opacity .2s; }
</style>

        s += '<circle class="dot" cx="' + end[0] + '" cy="' + end[1] + '" r="4"/>';
      }
      s += '<text class="tick" x="' + L + '" y="' + (H - 6) + '">' + esc(fmtDate(t[0].date)) + "</text>" +
        '<text class="tick" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(fmtDate(t[t.length - 1].date)) + "</text>";
      for (i = 0; i < t.length; i++) {
        var tip = fmtDate(t[i].date) + ": " + money(t[i].spend, b.currency) + " spend, " + count(t[i].conversions) + " conversions";
        s += '<rect class="hit" x="' + round(L + step * i, 1) + '" y="' + T + '" width="' + round(step, 1) + '" height="' + (H - T - B) +
          '" tabindex="0" data-tip="' + esc(tip) + '" data-x="' + round(L + step * (i + 0.5), 1) + '"/>';
      }
      s += '<line class="cross" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '"/>';
      return s + "</svg></figure>";
    }
    var cur = b.currency;
    return '<section class="trend" aria-label="Daily trend">' +
      chart("spend", "line", "Daily spend", function (v, tick) { return tick ? money(v, cur).replace(/\.00$/, "") : money(v, cur); }) +
      chart("conversions", "col", "Daily conversions", function (v) { return count(round(v, 1)); }) + "</section>";
  }
  function niceMax(v) {
    if (!(v > 0)) return 1;
    var e = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), f = v / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  }
  function colPath(x, y, w, h) {
    var r = Math.min(4, w / 2, h);
    x = round(x, 1); y = round(y, 1); w = round(w, 1); h = round(h, 1);
    return "M" + x + "," + (y + h) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
      "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
  }

  function spendBars(b) {
    var c = b.campaigns, max = 0, i;
    if (!c.length) return "";
    for (i = 0; i < c.length; i++) max = Math.max(max, c[i].m.spend || 0);
    var share = b.totals.spend ? function (v) { return round((v || 0) / b.totals.spend * 100, 1).toFixed(1) + "%"; } : function () { return ""; };
    var h = '<figure class="bars"><figcaption>Spend by campaign</figcaption><ol>';
    for (i = 0; i < c.length; i++) {
      var w = max ? round((c[i].m.spend || 0) / max * 100, 1) : 0;
      h += '<li tabindex="0" data-tip="' + esc(c[i].name + ": " + money(c[i].m.spend, b.currency) + " (" + share(c[i].m.spend) + " of spend)") + '">' +
        '<span class="bname">' + esc(c[i].name) + "</span>" +
        '<span class="track"><span class="bar" style="width:' + w + '%"></span></span>' +
        '<span class="bval">' + esc(money(c[i].m.spend, b.currency)) + "</span></li>";
    }
    return h + "</ol></figure>";
  }

  function tree(b) {
    var h = '<section class="tree" aria-label="Account structure"><h2>Structure</h2><ul role="tree">' +
      '<li role="treeitem" aria-expanded="true"><span class="node acct">' + esc(b.account.name || "Google Ads account") +
      ' <small>' + esc(b.account.id) + "</small></span><ul role=\"group\">";
    for (var i = 0; i < b.campaigns.length; i++) {
      var c = b.campaigns[i], groups = b.adGroups ? (b.adGroups[c.id] || []) : null;
      h += '<li role="treeitem"' + (groups && groups.length ? ' aria-expanded="true"' : "") + '><span class="node">' + esc(c.name) + " " + status(c.status) +
        '<small class="meta">' + esc(money(c.m.spend, b.currency)) + "</small></span>";
      if (groups && groups.length) {
        h += '<ul role="group">';
        for (var j = 0; j < groups.length; j++) h += '<li role="treeitem"><span class="node leaf">' + esc(groups[j].name) + " " + status(groups[j].status) + "</span></li>";
        h += "</ul>";
      } else if (groups) h += '<ul role="group"><li role="treeitem"><span class="node leaf none">no ad groups listed</span></li></ul>';
      h += "</li>";
    }
    return h + "</ul></li></ul></section>";
  }

  function budgetTable(b) {
    if (!b.budgets || !b.budgets.rows.length) return "";
    var h = '<section class="budget"><h2>Spend vs daily budget</h2><p class="meta">Average daily spend over the ' + b.budgets.days +
      " days the account served in this period, against each campaign's daily budget today.</p>" +
      '<div class="wrap"><table><thead><tr><th scope="col">Campaign</th><th scope="col">Use of budget</th>' +
      '<th scope="col">Avg / day</th><th scope="col">Budget / day</th><th scope="col">Used</th></tr></thead><tbody>';
    for (var i = 0; i < b.budgets.rows.length; i++) {
      var r = b.budgets.rows[i], w = r.used === null ? 0 : Math.min(r.used, 150) / 150 * 100;
      h += '<tr class="b" data-row="' + esc(r.id) + '"><th scope="row"><span class="cname">' + esc(r.name) + "</span>" + status(r.status) + "</th>" +
        '<td class="meter" aria-hidden="true"><span class="mtrack"><span class="mfill' + (r.used > 100 ? " over" : "") + '" style="width:' + round(w, 1) +
        '%"></span><span class="mline"></span></span></td>' +
        '<td data-col="avg">' + esc(money(r.avg, b.currency)) + '</td><td data-col="budget">' + esc(money(r.budget, b.currency)) +
        '</td><td data-col="used">' + (r.used === null ? DASH : r.used + "%") + "</td></tr>";
    }
    return h + "</tbody></table></div></section>";
  }

  var COLUMNS = [
    { key: "spend", label: "Spend", type: "money", better: null, delta: true },
    { key: "clicks", label: "Clicks", type: "int", better: true, delta: false },
    { key: "ctr", label: "CTR", type: "pct", better: true, delta: false },
    { key: "conversions", label: "Conv.", type: "decimal", better: true, delta: true },
    { key: "cpa", label: "Cost / conv.", type: "money", better: false, delta: true },
    { key: "roas", label: "ROAS", type: "ratio", better: true, delta: true }
  ];
  function table(b) {
    var hasPrev = !!b.prevTotals, i, j;
    var h = '<section class="perf"><h2>Campaign performance</h2><div class="wrap"><table><thead><tr><th scope="col">Campaign</th>';
    for (j = 0; j < COLUMNS.length; j++) h += '<th scope="col">' + esc(COLUMNS[j].label) + (hasPrev && COLUMNS[j].delta ? '</th><th scope="col" class="d">vs prev.' : "") + "</th>";
    h += "</tr></thead><tbody>";
    function cells(m, p, row) {
      var s = "";
      for (var k = 0; k < COLUMNS.length; k++) {
        var col = COLUMNS[k];
        s += '<td data-col="' + col.key + '">' + esc(FORMAT[col.type](m[col.key], b.currency)) + "</td>";
        if (hasPrev && col.delta) s += '<td class="d" data-col="' + col.key + '-delta">' + (p ? chip(deltaPct(m[col.key], p[col.key]), col.better) : '<span class="delta none">new</span>') + "</td>";
      }
      return s;
    }
    for (i = 0; i < b.campaigns.length; i++) {
      var c = b.campaigns[i];
      h += '<tr data-row="' + esc(c.id) + '"><th scope="row"><span class="cname">' + esc(c.name) + "</span>" + status(c.status) + "</th>" + cells(c.m, c.prev) + "</tr>";
    }
    h += '</tbody><tfoot><tr data-row="total"><th scope="row">Total</th>' + cells(b.totals, b.prevTotals) + "</tr></tfoot></table></div></section>";
    return h;
  }

  function render(b) {
    if (!b || b.error) return '<div class="empty">' + esc(b && b.error ? b.error : "No data yet.") + "</div>";
    var h = '<header><div class="brand"><span class="mark" aria-hidden="true"></span>AdvisorPPC <span>Campaign Board</span></div>' +
      '<p class="meta">' + esc(b.account.name ? b.account.name + " · " : "") + esc(b.account.id) + " · " + esc(range(b.period)) +
      (b.previous ? " vs " + esc(range(b.previous)) : "") + (b.currency ? " · " + esc(b.currency) : "") + "</p>" +
      "<h1>" + esc(b.headline) + "</h1></header>";
    h += kpiTiles(b);
    if (b.insights.length) {
      h += '<section class="insights"><h2>Worth a look</h2><ul>';
      for (var i = 0; i < b.insights.length; i++) h += '<li class="' + esc(b.insights[i].kind) + '">' + esc(b.insights[i].text) + "</li>";
      h += "</ul></section>";
    }
    if (b.actions.length) {
      h += '<section class="actions"><h2>Next actions</h2><ol>';
      for (var a = 0; a < b.actions.length; a++) h += '<li data-rule="' + esc(b.actions[a].rule) + '">' + esc(b.actions[a].text) + "</li>";
      h += "</ol></section>";
    }
    h += trendCharts(b);
    h += '<div class="split">' + spendBars(b) + tree(b) + "</div>";
    h += budgetTable(b);
    h += table(b);
    for (var n = 0; n < b.notes.length; n++) h += '<p class="note">' + esc(b.notes[n]) + "</p>";
    return h;
  }

  // Load generations: begin() marks a new load and returns isCurrent(), which
  // stays true only until the next begin(). A host drops any answer whose load
  // is no longer current, so a slow read for an account the viewer has left
  // can never paint over the account the picker names.
  function latest() {
    var n = 0;
    return function begin() { var mine = ++n; return function isCurrent() { return mine === n; }; };
  }

  var api = {
    parse: parse, compute: compute, render: render, latest: latest,
    format: { money: money, count: count, pct: pct, roas: roas, deltaPct: deltaPct, deltaText: deltaText },
    esc: esc
  };
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.AdvisorBoard = api;
})(this);

</script>
<script>
(function () {
  "use strict";
  var B = window.AdvisorBoard;
  var SERVER = "AdvisorPPC";            // the connector's display name on claude.ai
  var CONNECT_URL = "https://mcp.advisorppc.com/dashboard";
  var UI_PROTOCOL = "2026-01-26";
  var board = document.getElementById("board"), banner = document.getElementById("banner");
  var toolbar = document.getElementById("toolbar"), tip = document.getElementById("tip");
  var settled = false;

  function paint(inputs) { board.className = ""; board.innerHTML = B.render(B.compute(inputs)); }
  function message(html) { board.className = ""; board.innerHTML = '<div class="empty">' + html + "</div>"; }
  function note(html) { banner.innerHTML = html; banner.hidden = false; }

  // ---- hover layer: any [data-tip] mark; the day columns also move the crosshair
  function showTip(el, x, y) {
    tip.textContent = el.getAttribute("data-tip");
    tip.style.display = "block";
    var r = tip.getBoundingClientRect();
    tip.style.left = Math.max(4, Math.min(window.innerWidth - r.width - 4, x + 12)) + "px";
    tip.style.top = Math.max(4, y - r.height - 10) + "px";
    var cross = el.parentNode && el.parentNode.querySelector && el.parentNode.querySelector(".cross");
    if (cross && el.getAttribute("data-x")) {
      cross.setAttribute("x1", el.getAttribute("data-x")); cross.setAttribute("x2", el.getAttribute("data-x"));
      cross.setAttribute("class", "cross on");
    }
  }
  function hideTip(el) {
    tip.style.display = "none";
    var cross = el && el.parentNode && el.parentNode.querySelector && el.parentNode.querySelector(".cross");
    if (cross) cross.setAttribute("class", "cross");
  }
  function tipTarget(t) { while (t && t !== board) { if (t.getAttribute && t.getAttribute("data-tip")) return t; t = t.parentNode; } return null; }
  board.addEventListener("pointermove", function (e) { var t = tipTarget(e.target); if (t) showTip(t, e.clientX, e.clientY); else hideTip(); });
  board.addEventListener("pointerleave", function () { hideTip(); });
  board.addEventListener("focusin", function (e) { var t = tipTarget(e.target); if (t) { var r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top); } });
  board.addEventListener("focusout", function (e) { hideTip(tipTarget(e.target)); });

  // ---- windows: the newest 30 full days (through yesterday) and the 30 before
  function iso(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function windows(now) {
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    var start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 29);
    var pEnd = new Date(start.getFullYear(), start.getMonth(), start.getDate() - 1);
    var pStart = new Date(pEnd.getFullYear(), pEnd.getMonth(), pEnd.getDate() - 29);
    return { current: iso(start) + "," + iso(end), previous: iso(pStart) + "," + iso(pEnd) };
  }

  // ---- sample board: public viewers, previews, and anyone without the connector
  function sample(reason) {
    if (settled) return;
    settled = true;
    var el = document.getElementById("sample-data"), s = JSON.parse(el.textContent);
    if (s.snapshot) {
      note("<b>Snapshot.</b> Read from the AdvisorPPC connector at " + B.esc(s.snapshot.readAt) + ". " + B.esc(s.snapshot.note || "") +
        " Open it in claude.ai with the connector added to see today's numbers.");
      paint(s);
      return;
    }
    note("<b>Sample data.</b> " + reason + ' Connect the AdvisorPPC connector in claude.ai (Settings, Connectors) or at <a href="' +
      CONNECT_URL + '" target="_blank" rel="noopener noreferrer">mcp.advisorppc.com</a>, then reopen this board to see your own campaigns.');
    paint(s);
  }

  // ---- 1. claude.ai artifact: the connector runs through the viewer's own connection.
  // RUNTIME BINDING. The page-side connector API is documented only in the
  // artifact runtime skill that Claude Code loads when it publishes a page with
  // capabilities.mcp (code.claude.com/docs/en/artifacts, "Pull live data with
  // MCP connectors"). The publish session confirms or rewrites this one function;
  // it must return call(tool, args) -> Promise<result>
  // or null when this viewer has no connector access.
  function artifactConnector() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") return Promise.resolve(null);
    return Promise.resolve(c.use("mcp")).then(function (mcp) {
      if (!mcp || typeof mcp.call !== "function") return null;
      return function (tool, args) { return mcp.call(SERVER, tool, args); };
    }, function () { return null; });
  }

  function errorOf(result) { var p = B.parse(result); return p.data ? null : (p.error || "no data"); }
  function connectHint(err) {
    return /not connected|connect|no google/i.test(err || "")
      ? 'Google Ads is not connected to AdvisorPPC yet. Connect it at <a href="' + CONNECT_URL + '" target="_blank" rel="noopener noreferrer">mcp.advisorppc.com</a>, then reload.'
      : "The connector answered: " + B.esc(err) + ". Reload to try again.";
  }

  function live(call) {
    settled = true;
    message("Reading your Google Ads accounts…");
    call("ga_accessible_customers_tool", {}).then(function (accounts) {
      var err = errorOf(accounts);
      if (err) { message(connectHint(err)); return; }
      var list = (B.parse(accounts).data.accounts || []).filter(function (a) { return !(a.manager || a.is_manager); });
      if (!list.length) { message('No Google Ads account found on this connection. Add one at <a href="' + CONNECT_URL + '" target="_blank" rel="noopener noreferrer">mcp.advisorppc.com</a>.'); return; }
      var pick = document.createElement("select");
      pick.setAttribute("aria-label", "Google Ads account");
      list.forEach(function (a) { var o = document.createElement("option"); o.value = a.id; o.textContent = (a.name || "Account") + " · " + a.id; pick.appendChild(o); });
      var again = document.createElement("button");
      again.type = "button"; again.textContent = "Refresh";
      toolbar.textContent = "Account"; toolbar.appendChild(pick); toolbar.appendChild(again); toolbar.hidden = false;
      var begin = B.latest();
      function load() {
        // only the newest load may paint: the picker and the board never disagree
        var current = begin(), cid = pick.value, w = windows(new Date()), via = null;
        list.forEach(function (a) { if (String(a.id) === cid && a.via_manager) via = String(a.via_manager); });
        board.className = "loading";
        var args = function (range, extra) {
          var a = { customer_id: cid, date_range: range, limit: 500 };
          for (var k in extra) a[k] = extra[k];
          return mcc(a);
        };
        // a client account reached through a manager is read with that manager as the login
        var mcc = function (a) { if (via) a.login_customer_id = via; return a; };
        var soft = function (p) { return p.then(null, function () { return null; }); };
        Promise.all([
          call("ga_campaign_performance_tool", args(w.current, {})),
          soft(call("ga_campaign_performance_tool", args(w.previous, {}))),
          soft(call("ga_campaign_performance_tool", args(w.current, { segment_by_day: true, limit: 10000 }))),
          soft(call("ga_list_ad_groups_tool", mcc({ customer_id: cid, limit: 500 }))),
          soft(call("ga_list_campaigns_tool", mcc({ customer_id: cid, limit: 500 })))
        ]).then(function (r) {
          if (!current()) return;
          var err = errorOf(r[0]);
          if (err) { message(connectHint(err)); return; }
          paint({ accounts: accounts, current: r[0], previous: r[1], daily: r[2], adGroups: r[3], campaignList: r[4], customerId: cid });
        }, function (e) { if (current()) message(connectHint(e && e.message)); });
      }
      pick.addEventListener("change", load);
      again.addEventListener("click", load);
      load();
    }, function (e) { message(connectHint(e && e.message)); });
  }

  // ---- 2. MCP Apps host (the connector serves this page as ui://): the host
  // pushes the tool result; one window, so the board shows no comparison.
  var initialized = false, lastHeight = 0;
  function reportSize() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (initialized && h > 0 && h !== lastHeight) { lastHeight = h; parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: h } }, "*"); }
  }
  function theme(ctx) { if (ctx && (ctx.theme === "light" || ctx.theme === "dark")) document.documentElement.setAttribute("data-theme", ctx.theme); }
  window.addEventListener("message", function (ev) {
    if (!ev || ev.source !== parent) return;
    var msg = ev.data;
    if (!msg || typeof msg !== "object" || msg.jsonrpc !== "2.0") return;
    if (msg.id === "advisorppc-board-init") {
      if (initialized || !msg.result || msg.result.protocolVersion !== UI_PROTOCOL) return;
      initialized = true; settled = true;
      theme(msg.result.hostContext);
      message("Waiting for campaign data…");
      parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
      if (typeof ResizeObserver === "function") new ResizeObserver(reportSize).observe(document.documentElement);
      return;
    }
    if (!initialized) return;
    if (msg.method === "ui/notifications/tool-result" && msg.params) paint({ current: msg.params });
    else if (msg.method === "ui/notifications/host-context-changed") theme(msg.params);
    else if (msg.method === "ping" && msg.id != null) parent.postMessage({ jsonrpc: "2.0", id: msg.id, result: {} }, "*");
  });

  // ---- start
  if (/[#&]sample\b/.test(location.hash)) { sample("This is the fixture board."); return; }
  artifactConnector().then(function (call) {
    if (call) { live(call); return; }
    if (window.parent && window.parent !== window) {
      try {
        parent.postMessage({ jsonrpc: "2.0", id: "advisorppc-board-init", method: "ui/initialize", params: {
          appInfo: { name: "AdvisorPPC Campaign Board", version: "1.0.0" },
          appCapabilities: { availableDisplayModes: ["inline"] }, protocolVersion: UI_PROTOCOL } }, "*");
      } catch (e) {}
    }
    setTimeout(function () { sample("Live numbers need a signed-in claude.ai account with the connector added."); }, 1200);
  });
})();
</script>
</body>
</html>
